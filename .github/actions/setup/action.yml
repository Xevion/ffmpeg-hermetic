name: setup
description: Installs zig, restores the package and build caches and fetches the dependencies a build needs.

inputs:
  args:
    description: zig build options that decide which (lazy) dependencies are fetched
    required: true

runs:
  using: composite
  steps:
    - uses: mlugg/setup-zig@v2.2.1
      with:
        version: 0.17.0
        use-cache: false
    - uses: actions/cache@v6.1.0
      with:
        path: zig-pkg
        key: zig-pkg-${{ runner.os }}-${{ hashFiles('build.zig.zon') }}
        restore-keys: zig-pkg-${{ runner.os }}-
    # One build cache per set of options. A fetched package's repack in p/ unpacks one directory
    # too deep, and the configured graph in c/ holds this run's zig path, so both stay out.
    - id: build-key
      shell: bash
      run: |
        echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
        echo "key=$(printf '%s' "${{ inputs.args }}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v6.1.0
      with:
        path: |
          .zig-cache
          !.zig-cache/c
          !.zig-cache/p
          !.zig-cache/tmp
        key: zig-build-${{ runner.os }}-${{ steps.build-key.outputs.key }}-${{ github.sha }}
        restore-keys: zig-build-${{ runner.os }}-${{ steps.build-key.outputs.key }}-
    # zig 0.17 misses on any file whose inode changed, and a restore gives every file a new one.
    # TODO: drop this step and tools/zig_restat.zig once the pinned zig is 0.18.
    - name: Restat
      shell: bash
      run: |
        lib=$(zig env | sed -n 's/^ *\.lib_dir = "\(.*\)",$/\1/p' | sed 's/\\\\/\\/g')
        zig run tools/zig_restat.zig -- .zig-cache . "$lib"
    # Upstream hosts drop connections now and then; a configure pass fetches every package.
    - name: Fetch
      shell: bash
      run: |
        rm -rf .zig-cache/c
        for attempt in 1 2 3 4; do
          zig build ${{ inputs.args }} -l > /dev/null && exit 0
          echo "fetch attempt $attempt failed" >&2
          sleep $((attempt * 15))
        done
        exit 1
