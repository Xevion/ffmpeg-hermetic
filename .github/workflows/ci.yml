name: ci

on:
  push:
  pull_request:

env:
  ZIG_VERSION: 0.17.0
  # Libraries enabled after the checked-in configure oracles were captured.
  ORACLE_FLAGS: -Dopenssl=false -Dvulkan_headers=false -Damf=false -Dlibvpl=false -Dopencl=false

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-linux-gnu.2.17
            oracle: x86_64-linux
          - runner: ubuntu-24.04-arm
            target: aarch64-linux-gnu.2.17
            oracle: aarch64-linux
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
      - name: Oracle (LGPL)
        run: |
          zig build -Dtarget=${{ matrix.target }} --release=fast -Donly=ffmpeg $ORACLE_FLAGS --prefix out/oracle-lgpl
          python3 tools/check_config.py out/oracle-lgpl/share/ffmpeg-zig/config gen/ffmpeg/${{ matrix.oracle }}-lgpl/oracle
      - name: Oracle (GPL)
        if: matrix.oracle == 'x86_64-linux'
        run: |
          zig build -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Donly=ffmpeg $ORACLE_FLAGS --prefix out/oracle-gpl
          python3 tools/check_config.py out/oracle-gpl/share/ffmpeg-zig/config gen/ffmpeg/${{ matrix.oracle }}-gpl/oracle
      - name: Bundles
        run: |
          zig build -Dtarget=${{ matrix.target }} --release=fast -Donly=ffmpeg --prefix out/lgpl bundle
          zig build -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Donly=ffmpeg --prefix out/gpl bundle
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundles-${{ matrix.target }}
          path: |
            out/lgpl/bundle/*.tar.zst*
            out/gpl/bundle/*.tar.zst*

  cross:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows-gnu, x86_64-macos, aarch64-macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
      - name: Libraries
        run: zig build -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false

  msvc:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-windows-msvc, aarch64-windows-msvc]
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/cache@v6.1.0
        with:
          path: zig-pkg
          key: zig-pkg-${{ hashFiles('build.zig.zon') }}
      - name: Libraries
        run: zig build -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false
