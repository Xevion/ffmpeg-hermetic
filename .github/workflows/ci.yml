name: ci

on:
  push:
  pull_request:

jobs:
  # Every checked-in configure oracle, resolved without compiling anything.
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: -Dgpl -Donly=ffmpeg -Dffmpeg-version=9.0
      - run: tools/check_oracles.sh

  build:
    name: build (${{ matrix.target }}, ${{ matrix.variant }}${{ matrix.version && format(', {0}', matrix.version) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: lgpl, fate: true }
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: gpl, fate: true }
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: lgpl, version: "9.0" }
          - { os: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.17, oracle: aarch64-linux, variant: lgpl }
          - { os: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.17, oracle: aarch64-linux, variant: gpl }
          - { os: ubuntu-24.04, target: x86_64-windows-gnu, oracle: x86_64-windows-gnu, variant: lgpl }
          - { os: ubuntu-24.04, target: x86_64-windows-gnu, oracle: x86_64-windows-gnu, variant: gpl }
          - { os: ubuntu-24.04, target: x86_64-macos, oracle: x86_64-macos, variant: lgpl }
          - { os: ubuntu-24.04, target: x86_64-macos, oracle: x86_64-macos, variant: gpl }
          - { os: ubuntu-24.04, target: aarch64-macos, oracle: aarch64-macos, variant: lgpl }
          - { os: ubuntu-24.04, target: aarch64-macos, oracle: aarch64-macos, variant: gpl }
          - { os: windows-2025, target: x86_64-windows-msvc, oracle: x86_64-windows-msvc, variant: lgpl }
          - { os: windows-2025, target: x86_64-windows-msvc, oracle: x86_64-windows-msvc, variant: gpl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ARGS: >-
        -Dtarget=${{ matrix.target }} --release=fast -Donly=ffmpeg
        ${{ matrix.variant == 'gpl' && '-Dgpl' || '' }}
        ${{ matrix.version && format('-Dffmpeg-version={0}', matrix.version) || '' }}
        ${{ matrix.fate && '-Dprograms=true' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: ${{ env.ARGS }}
      - name: Build and bundle
        run: |
          read -ra args <<< "$ARGS"
          zig build "${args[@]}" --prefix out install bundle bundle-check
      # The config job runs off Windows, where msvc oracles need an SDK.
      - name: Oracle (msvc)
        if: runner.os == 'Windows'
        run: tools/check_oracles.sh ${{ matrix.target }}-${{ matrix.variant }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.target }}-${{ matrix.variant }}${{ matrix.version && format('-{0}', matrix.version) || '' }}
          path: out/bundle/*.tar.zst*
      - name: FATE samples
        if: matrix.fate
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        if: matrix.fate
        with:
          path: fate-suite
          key: fate-suite-${{ steps.month.outputs.month }}
          restore-keys: fate-suite-
      - name: FATE
        if: matrix.fate
        run: |
          sudo apt-get install -y nasm libxml2-utils
          rsync -rltLW --delete rsync://fate-suite.ffmpeg.org/fate-suite/ fate-suite/
          hash=$(sed -n '/^        \.ffmpeg_8_1 = \.{/,/}/s/.*\.hash = "\(.*\)".*/\1/p' build.zig.zon)
          XFAIL=tools/fate_xfail.txt JOBS=4 tools/fate.sh out "zig-pkg/$hash" fate-suite

  # Targets FFmpeg does not build for yet: only the libraries.
  libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: aarch64-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false
      - run: zig build -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false
