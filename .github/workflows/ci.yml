name: ci

on:
  push:
    branches: ["**"]
    tags: ["[0-9]+.[0-9]+.[0-9]+-r[0-9]+"]
  pull_request:
  # A release dry run: builds as the tag would and prints the release, without publishing.
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to rehearse, e.g. 8.1.3-r1
        required: true

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag || '' }}

jobs:
  # Every checked-in configure oracle, resolved without compiling anything.
  config:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: -Dgpl -Donly=ffmpeg -Dffmpeg-version=9.0
      - run: tools/check_oracles.sh

  build:
    name: build (${{ matrix.target }}, ${{ matrix.variant }}${{ matrix.version && format(', {0}', matrix.version) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: lgpl, fate: true }
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: gpl, fate: true }
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: lgpl, version: "9.0" }
          - { os: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.17, oracle: aarch64-linux, variant: lgpl }
          - { os: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.17, oracle: aarch64-linux, variant: gpl }
          - { os: ubuntu-24.04, target: x86_64-windows-gnu, oracle: x86_64-windows-gnu, variant: lgpl, reproduce: true }
          - { os: ubuntu-24.04, target: x86_64-windows-gnu, oracle: x86_64-windows-gnu, variant: gpl }
          - { os: ubuntu-24.04, target: x86_64-macos, oracle: x86_64-macos, variant: lgpl }
          - { os: ubuntu-24.04, target: x86_64-macos, oracle: x86_64-macos, variant: gpl }
          - { os: ubuntu-24.04, target: aarch64-macos, oracle: aarch64-macos, variant: lgpl }
          - { os: ubuntu-24.04, target: aarch64-macos, oracle: aarch64-macos, variant: gpl }
          - { os: windows-2025, target: x86_64-windows-msvc, oracle: x86_64-windows-msvc, variant: lgpl, reproduce: true }
          - { os: windows-2025, target: x86_64-windows-msvc, oracle: x86_64-windows-msvc, variant: gpl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ARGS: >-
        -Dtarget=${{ matrix.target }} --release=fast -Donly=ffmpeg
        ${{ matrix.variant == 'gpl' && '-Dgpl' || '' }}
        ${{ matrix.version && format('-Dffmpeg-version={0}', matrix.version) || '' }}
        -Dprograms=true
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: ${{ env.ARGS }}
      - name: Build and bundle
        run: |
          read -ra args <<< "$ARGS"
          [[ -z $RELEASE_TAG ]] || args+=("-Dbundle-rev=${RELEASE_TAG##*-r}")
          zig build "${args[@]}" --prefix out install bundle bundle-check
      - name: Run ffmpeg
        if: (runner.os == 'Linux' && contains(matrix.target, 'linux')) || runner.os == 'Windows'
        run: out/bin/ffmpeg -hide_banner -f lavfi -i testsrc2=d=1 -c:v libvpx-vp9 -f null -
      # The config job runs off Windows, where msvc oracles need an SDK.
      - name: Oracle (msvc)
        if: runner.os == 'Windows'
        run: tools/check_oracles.sh ${{ matrix.target }}-${{ matrix.variant }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.target }}-${{ matrix.variant }}${{ matrix.version && format('-{0}', matrix.version) || '' }}
          path: out/bundle/*.tar.zst*
      # Releases are cut when the recipe changes, so a cold build elsewhere must give the same bytes.
      - name: Reproduce from another directory
        if: matrix.reproduce
        run: |
          git worktree add --detach "$RUNNER_TEMP/repro" HEAD
          cp -a zig-pkg "$RUNNER_TEMP/repro/"
          read -ra args <<< "$ARGS"
          [[ -z $RELEASE_TAG ]] || args+=("-Dbundle-rev=${RELEASE_TAG##*-r}")
          (cd "$RUNNER_TEMP/repro" && ZIG_GLOBAL_CACHE_DIR="$RUNNER_TEMP/repro-global" zig build "${args[@]}" --prefix out bundle)
          a=(out/bundle/*/); b=("$RUNNER_TEMP"/repro/out/bundle/*/)
          status=0
          for f in out/bundle/*.tar.zst; do
            cmp "$f" "$RUNNER_TEMP/repro/$f" || status=1
          done
          if (( status )); then
            jq -r .recipe "${a[0]}MANIFEST.json" "${b[0]}MANIFEST.json"
            diff -rq "${a[0]}" "${b[0]}"
            exit 1
          fi
      - name: FATE samples
        if: matrix.fate
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        if: matrix.fate
        with:
          path: fate-suite
          key: fate-suite-${{ steps.month.outputs.month }}
          restore-keys: fate-suite-
      - name: FATE
        if: matrix.fate
        run: |
          sudo apt-get install -y nasm libxml2-utils
          rsync -rltLW --delete rsync://fate-suite.ffmpeg.org/fate-suite/ fate-suite/
          hash=$(sed -n '/^        \.ffmpeg_8_1 = \.{/,/}/s/.*\.hash = "\(.*\)".*/\1/p' build.zig.zon)
          XFAIL=tools/fate_xfail.txt JOBS=4 tools/fate.sh out "zig-pkg/$hash" fate-suite

  # Targets FFmpeg does not build for yet: only the libraries.
  libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2025, target: aarch64-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false
      - run: zig build -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false

  # On a version tag, every bundle of that FFmpeg version becomes the GitHub Release.
  release:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [config, build, libraries]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: bundle-*
          path: all
          merge-multiple: true
      - name: Assemble
        run: |
          prefix="ffmpeg-hermetic-${RELEASE_TAG%-r*}-r${RELEASE_TAG##*-r}-"
          mkdir dist
          shopt -s nullglob
          files=(all/"$prefix"*.tar.zst)
          (( ${#files[@]} )) || { echo "no bundle named $prefix*"; ls all; exit 1; }
          cp "${files[@]}" dist/
          (cd dist && sha256sum -- *.tar.zst > SHA256SUMS)
          python3 - "$RELEASE_TAG" > notes.md <<'PY'
          import re, sys
          tag = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"CHANGELOG.md has no section for {tag}")
          print(m.group(1).strip())
          PY
          ls -l dist
          cat notes.md
      - name: Publish
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "FFmpeg ${RELEASE_TAG%-r*} r${RELEASE_TAG##*-r}" --notes-file notes.md
