name: ci

on:
  push:
  pull_request:

env:
  # Libraries enabled after the checked-in configure oracles were captured.
  ORACLE_FLAGS: -Dopenssl=false -Dvulkan_headers=false -Damf=false -Dlibvpl=false -Dopencl=false

jobs:
  build:
    name: build (${{ matrix.target }}, ${{ matrix.variant }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: lgpl, fate: true }
          - { os: ubuntu-24.04, target: x86_64-linux-gnu.2.17, oracle: x86_64-linux, variant: gpl, fate: true }
          - { os: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.17, oracle: aarch64-linux, variant: lgpl }
          - { os: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.17, oracle: aarch64-linux, variant: gpl }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      ARGS: >-
        -Dtarget=${{ matrix.target }} --release=fast -Donly=ffmpeg
        ${{ matrix.variant == 'gpl' && '-Dgpl' || '' }}
        ${{ matrix.fate && '-Dprograms=true' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: ${{ env.ARGS }}
      - name: Oracle
        run: |
          dir=gen/ffmpeg/${{ matrix.oracle }}-${{ matrix.variant }}/oracle
          [ -d "$dir" ] || { echo "no oracle for this target"; exit 0; }
          read -ra args <<< "$ARGS $ORACLE_FLAGS"
          zig build "${args[@]}" --prefix oracle
          python3 tools/check_config.py oracle/share/ffmpeg-zig/config "$dir"
      - name: Build and bundle
        run: |
          read -ra args <<< "$ARGS"
          zig build "${args[@]}" --prefix out install bundle bundle-check
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-${{ matrix.target }}-${{ matrix.variant }}
          path: out/bundle/*.tar.zst*
      - name: FATE samples
        if: matrix.fate
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6.1.0
        if: matrix.fate
        with:
          path: fate-suite
          key: fate-suite-${{ steps.month.outputs.month }}
          restore-keys: fate-suite-
      - name: FATE
        if: matrix.fate
        run: |
          sudo apt-get install -y nasm libxml2-utils
          rsync -rltLW --delete rsync://fate-suite.ffmpeg.org/fate-suite/ fate-suite/
          hash=$(sed -n '/^        \.ffmpeg = \.{/,/}/s/.*\.hash = "\(.*\)".*/\1/p' build.zig.zon)
          XFAIL=tools/fate_xfail.txt JOBS=4 tools/fate.sh out "zig-pkg/$hash" fate-suite

  # Targets FFmpeg does not build for yet: only the libraries.
  libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-windows-gnu }
          - { os: ubuntu-24.04, target: x86_64-macos, extra: "-Dlibvpl=false -Drubberband=false" }
          - { os: ubuntu-24.04, target: aarch64-macos, extra: "-Dlibvpl=false -Drubberband=false" }
          - { os: windows-2025, target: x86_64-windows-msvc }
          - { os: windows-2025, target: aarch64-windows-msvc }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          args: -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false ${{ matrix.extra }}
      - run: zig build -Dtarget=${{ matrix.target }} --release=fast -Dgpl -Dffmpeg=false ${{ matrix.extra }}
